server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rebuild_api_upstream http://datara-rebuild-api-codex:8001;
  location /api/v1/ {
    proxy_pass $rebuild_api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The rebuild API accepts the legacy `token` header.  The isolated
    # browser probe also exercises the standard Authorization form; preserve
    # both so this validation proxy cannot mask either contract.
    proxy_set_header token $http_token;
    proxy_set_header Authorization "Bearer $http_token";
  }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
