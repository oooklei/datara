server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 301 使用相对 Location，避免 absolute_redirect 拼绝对地址时丢端口（裸 /ide → /ide/）
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rebuild_api_upstream http://datara-rebuild-api:8001;
  # /api 反代 rebuild 后端容器（同 datara_default 网络），禁止 18091 回环自指
  location /api/ { gzip off; proxy_pass $rebuild_api_upstream$request_uri; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_send_timeout 300s; }
  location /api/v1/rebuild/ide/stream { proxy_pass $rebuild_api_upstream$request_uri; proxy_buffering off; proxy_read_timeout 3600s; }
  # IDE API 一律通过 Datara 的 owner 网关；静态页面仍由原版 dbx 提供。
  location = /ide/api { return 404; }
  location ^~ /ide/api/ { rewrite ^/ide/api/(.*)$ /api/v1/rebuild/dbx/ide-proxy/$1 break; proxy_pass $rebuild_api_upstream$uri$is_args$args; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_send_timeout 300s; }
  # dbx IDE 子路径反代（dbx 在 deploy-19_default 网络，经宿主 4224 访问），SSE 直通
  # 同源直连网关：nginx 服务端注入短时嵌入令牌（来自 /embed/session 下发的 HttpOnly cookie），
  # 令牌不进 JS/localStorage/URL（方案规则 1/2）；DBX 容器侧按 project_id/user_id 自验自过滤。
  location /ide/ { proxy_pass http://192.168.1.9:4224/ide/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Datara-Embed-Token $cookie_datara_dbx_embed; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_send_timeout 300s; }
  # 海豚（DolphinScheduler）同源反代（§10.4 同源化）：UI 静态与 API 同 context-path
  # /dolphinscheduler/（1.9:12345，Web 容器内监听 80、API 代理契约不变）。
  # 任务中心 iframe 指向 /dolphinscheduler/ui/...?embed=1，与宿主同域，规避跨域自定义头限制。
  location = /dolphinscheduler { return 301 /dolphinscheduler/; }
  location /dolphinscheduler/ { proxy_pass http://192.168.1.9:12345/dolphinscheduler/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_send_timeout 300s; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
