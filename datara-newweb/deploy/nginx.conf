server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rebuild_api_upstream http://datara-rebuild-api:8001;
  location /api/v1/ { proxy_pass $rebuild_api_upstream$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/v1/rebuild/ide/stream { proxy_pass $rebuild_api_upstream$request_uri; proxy_buffering off; proxy_read_timeout 3600s; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
