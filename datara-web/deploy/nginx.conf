server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 动态解析上游：datara-api 容器重建后 IP 会变化，静态 proxy_pass 在启动时解析一次
    # 并永久缓存会导致 502（I16 实证）。改用 docker 内嵌 DNS（127.0.0.11）+ 变量形式
    # proxy_pass，每 10s 重新解析自动跟随容器 IP 漂移。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://datara-api:8000;

    # gzip：JS/CSS 主体压缩，hash 路由 SPA 首屏收益明显
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA（hash 路由）：任何路径兜底回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # I1 F9：API 反代到后端容器（datara-api，FastAPI 8000）
    # 注意：proxy_pass 含变量时 URI 按字面传递（不做 location 前缀替换），
    # 故用 $request_uri 完整透传（前后端路径一致，与原静态前缀替换等价）。
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # I10 G21：IDE SSE 推流（禁缓冲防心跳被攒包 + 长读超时防长任务断连）
    location /api/v1/ide/stream {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 静态资源长缓存（Vite 产物带内容 hash，文件名变更即失效）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
