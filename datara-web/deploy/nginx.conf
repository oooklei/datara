server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip：JS/CSS 主体压缩，hash 路由 SPA 首屏收益明显
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA（hash 路由）：任何路径兜底回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # I1 F9：API 反代到后端容器（datara-api，FastAPI 8000）
    location /api/ {
        proxy_pass http://datara-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # I10 G21：IDE SSE 推流（禁缓冲防心跳被攒包 + 长读超时防长任务断连）
    location /api/v1/ide/stream {
        proxy_pass http://datara-api:8000/api/v1/ide/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 静态资源长缓存（Vite 产物带内容 hash，文件名变更即失效）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
