# Canonical container proxy configuration is kept beside the legacy web
# deployment assets for compose/CI consumers.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://datara-api:8000;
location /api/ {
    proxy_pass $api_upstream$request_uri;
}
location /api/v1/ide/stream {
    proxy_pass $api_upstream$request_uri;
}
