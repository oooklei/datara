<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Datara I2 测试数据基座验证</title>
  <style>
    body{margin:0;background:#101827;color:#e5eefb;font:14px/1.6 system-ui,Segoe UI,sans-serif}main{max-width:960px;margin:32px auto;padding:0 20px}section{background:#172235;border:1px solid #2d405d;border-radius:12px;padding:18px;margin:14px 0}h1{margin:0 0 8px}h2{font-size:16px}label{display:inline-flex;gap:8px;align-items:center;margin:5px 12px 5px 0}input{background:#0f1725;color:#fff;border:1px solid #3b5578;border-radius:6px;padding:7px}button{background:#2e7cf6;border:0;color:#fff;border-radius:6px;padding:8px 14px;margin:5px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ok{color:#73e6a4}.bad{color:#ff9a9a}pre{white-space:pre-wrap;background:#0d1421;padding:12px;border-radius:8px;min-height:30px}.meta{color:#9bb1cc}
  </style>
</head>
<body>
<main>
  <div class="meta">I2 / REBUILD VALIDATION · 运行入口固定为 18091</div>
  <h1>测试数据基座闭环验证页</h1>
  <section>
    <h2>1. 验证会话</h2>
    <button id="logout" disabled>撤销验证会话</button>
    <div id="auth">等待验证运行器注入短时授权上下文</div>
  </section>
  <section>
    <h2>2. I2 数据集与对账状态</h2>
    <button id="status" disabled>读取基座状态</button>
    <pre id="result">等待 I2 验证</pre>
  </section>
  <script>
    const api='/api/v1/rebuild'; let token=window.__DATARA_TEST_TOKEN__||'';
    const $=id=>document.getElementById(id);
    const stamp=()=>new Date().toISOString();
    const show=(text,ok=true)=>{ $('result').textContent=`${text}\n\n请求时间：${stamp()}`; $('result').className=ok?'ok':'bad'; };
    async function call(path,options={}){const r=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})}});const body=await r.json();if(!r.ok)throw new Error(`HTTP ${r.status} ${body.msg||''}`);return body;}
    $('status').onclick=async()=>{try{const b=await call('/i2/status');const d=b.data;show(`I2 状态：${d.summary.status}\n生成时间：${d.generated_at}\nseed：${d.seed}\n数据库：${d.databases.join('、')}\n汇总：${JSON.stringify(d.summary)}\n样例文件：${d.samples.join('、')}`);}catch(e){show(`I2 状态读取失败：${e.message}`,false);}};
    $('logout').onclick=async()=>{try{await call('/logout',{method:'POST'});token='';$('auth').textContent=`Token：已撤销 · ${stamp()}`;$('logout').disabled=true;$('status').disabled=true;show('登出成功，旧 Token 已撤销');}catch(e){show(`登出失败：${e.message}`,false);}};
    if(token){$('auth').textContent=`验证运行器已注入短时授权上下文 · ${stamp()}`;$('logout').disabled=false;$('status').disabled=false;show('验证会话已初始化');}else{show('等待测试运行器通过受控验证会话启动本页',false);}
  </script>
</main>
</body>
</html>
