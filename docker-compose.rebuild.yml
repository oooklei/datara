services:
  datara-rebuild-api:
    image: datara-backend:latest
    container_name: dt-rebuild
    restart: unless-stopped
    command: ["uvicorn", "rebuild.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      TZ: Asia/Shanghai
      REBUILD_DB_URL: ${REBUILD_DB_URL:?REBUILD_DB_URL must be set in the runtime environment}
      REBUILD_TOKEN_SECRET: ${REBUILD_TOKEN_SECRET:?REBUILD_TOKEN_SECRET must be set in the runtime environment}
      REBUILD_VALIDATION_KEY: ${REBUILD_VALIDATION_KEY:-}
      REBUILD_MYSQL_SRC_URL: ${REBUILD_MYSQL_SRC_URL:-}
      REBUILD_LEGACY_META_URL: ${REBUILD_LEGACY_META_URL:?REBUILD_LEGACY_META_URL must be set for the I18 read-only preview}
      # STREAM 图执行链下发通道（rebuild→legacy 读写；裁决项 3）
      REBUILD_LEGACY_DB_URL: ${REBUILD_LEGACY_DB_URL:?REBUILD_LEGACY_DB_URL must be set for STREAM execution}
      REBUILD_RESOURCE_STORAGE_DIR: /datara/resource-storage
      I2_RECONCILE_PATH: /datara/logs/datagen/reconcile.json
      I2_SAMPLES_PATH: /datara/files/samples
    depends_on:
      mysql-meta:
        condition: service_healthy
      datara-mysql-src:
        condition: service_healthy
    volumes:
      - ./rebuild-source/rebuild:/app/rebuild:ro
      # STREAM 执行链在共享日志卷创建实例目录（裁决项 3）——需读写
      - datara-logs:/datara/logs
      - ./files:/datara/files:ro
      - datara-resource-storage:/datara/resource-storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/api/v1/rebuild/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
