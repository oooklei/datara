server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /api/ {
        proxy_pass http://192.168.1.9:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /ide/api { return 404; }

    location ^~ /ide/api/ {
        proxy_pass http://192.168.1.9:18091/api/v1/rebuild/dbx/ide-proxy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /ide/ {
        proxy_pass http://192.168.1.9:4224/ide/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
