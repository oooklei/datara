# Datara 前端容器 nginx：SPA + /api 反代 1.9 后端（含 SSE 直通）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback（#/hash 路由 + history 兼容）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 assets）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 后端反代：保持 /api 前缀原样转发到 1.9 nginx（其 /api/v1 已路由到 rebuild）
    location /api/ {
        proxy_pass http://192.168.1.9:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 直通（sql-ide events / 流观摩）
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 会话 cookie 由后端 Set-Cookie（datara_session，path=/api/v1），无需容器处理
}
