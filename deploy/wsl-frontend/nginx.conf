# Datara 前端容器 nginx：SPA + /api 反代 1.9 后端（含 SSE 直通）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback（#/hash 路由 + history 兼容）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 assets）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 后端反代：rebuild 后端真实入口为 1.9:18091（/api/v1/rebuild/*、/api/v1/projects/*；
    # 18090 是旧后端，rebuild 域全部 404，勿回指）
    location /api/ {
        # B6：/api 禁 gzip——nginx 压缩会移除上游强 ETag，前端组件 spec
        # 「强 SHA-256 ETag」校验将失败（components/spec 加载降级），故 API 面原样透传
        gzip off;
        proxy_pass http://192.168.1.9:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 直通（sql-ide events / 流观摩）
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 会话 cookie 由后端 Set-Cookie（datara_session，path=/api/v1），无需容器处理
}
