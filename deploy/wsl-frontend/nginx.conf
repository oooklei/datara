# Datara 前端容器 nginx：SPA + /api 反代 rebuild 后端（含 SSE 直通）
# /ide/ 反代 1.9:4224 dbx（dbx 以 /ide 为公共基路径运行，SSE 直通）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 301 一律使用相对 Location：避免 absolute_redirect 用 $host 拼绝对地址时丢端口
    # （裸 /ide 命中 /ide/ 前缀块会 301 到 /ide/，否则会指向 http://host/ide/ 连 80 失败）。
    absolute_redirect off;

    # Docker 内置 DNS：/api 上游按容器名解析，后端重建后无需重启本容器。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rebuild_api_upstream http://datara-rebuild-api:8001;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback（#/hash 路由 + history 兼容）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 assets）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 后端反代：rebuild 后端容器 datara-rebuild-api:8001（与本容器同在 datara_default 网络）。
    # 禁止写 8090 回环（会自指死循环），也不指向旧 18090 后端（rebuild 域全 404）。
    location /api/ {
        # B6：/api 禁 gzip——nginx 压缩会移除上游强 ETag，前端组件 spec
        # 「强 SHA-256 ETag」校验将失败（components/spec 加载降级），故 API 面原样透传
        gzip off;
        proxy_pass $rebuild_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 直通（sql-ide events / 流观摩）
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # DBX API 必须经 Datara owner proxy：/ide-session 签发的 datara_dbx_ide
    # cookie 只由 rebuild 后端解析，直通 DBX 会导致 iframe API/迁移状态 401。
    location = /ide/api { return 404; }
    location ^~ /ide/api/ {
        rewrite ^/ide/api/(.*)$ /api/v1/rebuild/dbx/ide-proxy/$1 break;
        proxy_pass $rebuild_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # dbx IDE 子路径反代：dbx 以 /ide 为公共基路径运行，SSE 直通。
    # dbx 容器在 deploy-19_default 网络，与本容器不同网络，故经宿主端口 4224 访问。
    location /ide/ {
        proxy_pass http://192.168.1.9:4224/ide/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 直通（dbx 事件流）
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 海豚（DolphinScheduler）同源反代（§10.4 同源化）：UI 静态与 API 同 context-path
    # /dolphinscheduler/（1.9:12345）。任务中心 iframe 指向 /dolphinscheduler/ui/...?embed=1，
    # 与宿主同域，规避跨域自定义头限制。
    location = /dolphinscheduler { return 301 /dolphinscheduler/; }
    location /dolphinscheduler/ {
        proxy_pass http://192.168.1.9:12345/dolphinscheduler/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 会话 cookie 由后端 Set-Cookie（datara_session，path=/api/v1），无需容器处理
}
